name = "unscrewed-api"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]
account_id = "485a8b721eeb6afa98c6e4071b50fe04"  # smb

workers_dev = true

# Custom domain — auto-creates AAAA + SSL on the unscrewed.lol zone.
[[routes]]
pattern = "api.unscrewed.lol"
custom_domain = true

# ---------- D1 ----------
[[d1_databases]]
binding = "DB"
database_name = "unscrewed"
database_id = "9369c48b-e156-4963-827e-a0b7ed76e149"
migrations_dir = "../../packages/db/src/migrations"

# ---------- KV ----------
[[kv_namespaces]]
binding = "SESSIONS"
id = "3f47aca094bf4d338da2fb0cbb71085f"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "d30c4d4391c64dbdbb0438235623c642"

# ---------- R2 ----------
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "unscrewed-photos"     # `wrangler r2 bucket create unscrewed-photos`

# ---------- Workers AI ----------
[ai]
binding = "AI"

# ---------- Durable Objects ----------
[[durable_objects.bindings]]
name = "NEGOTIATION"
class_name = "NegotiationRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NegotiationRoom"]

# ---------- Public env ----------
[vars]
PUBLIC_BASE_URL = "https://unscrewed.lol"
TOS_VERSION = "2026-05-28"

# ---------- Secrets (set via `wrangler secret put`, do NOT commit) ----------
# TELNYX_API_KEY
# TELNYX_MESSAGING_PROFILE_ID
# TELNYX_FROM_NUMBER
# SESSION_SECRET
# TURNSTILE_SECRET_KEY

# ======================================================================
# DEV environment — `wrangler deploy --env dev` produces a sibling
# Worker named "unscrewed-api-dev" bound to api-dev.unscrewed.lol. It
# shares D1, KV, R2, Durable Object, AI, and *secrets* with prod for
# now (one data store, two worker scripts). When we want true data
# isolation later, create dev-suffixed resources and re-point bindings.
#
# NOTE: main / compatibility_date / compatibility_flags are redeclared
# explicitly. Some wrangler versions (especially in Workers Builds CI)
# do not inherit these from the top-level block, and omitting them
# produces "Missing entry-point to Worker script" at deploy time.
# ======================================================================
[env.dev]
name = "unscrewed-api-dev"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[env.dev.routes]]
pattern = "api-dev.unscrewed.lol"
custom_domain = true

# Bindings are re-declared because wrangler does not inherit list-typed
# bindings (d1, kv, r2, durable_objects, migrations) across envs.
[[env.dev.d1_databases]]
binding = "DB"
database_name = "unscrewed"
database_id = "9369c48b-e156-4963-827e-a0b7ed76e149"
migrations_dir = "../../packages/db/src/migrations"

[[env.dev.kv_namespaces]]
binding = "SESSIONS"
id = "3f47aca094bf4d338da2fb0cbb71085f"

[[env.dev.kv_namespaces]]
binding = "RATE_LIMIT"
id = "d30c4d4391c64dbdbb0438235623c642"

[[env.dev.r2_buckets]]
binding = "PHOTOS"
bucket_name = "unscrewed-photos"

[env.dev.ai]
binding = "AI"

[[env.dev.durable_objects.bindings]]
name = "NEGOTIATION"
class_name = "NegotiationRoom"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["NegotiationRoom"]

[env.dev.vars]
PUBLIC_BASE_URL = "https://dev.unscrewed.lol"
TOS_VERSION = "2026-05-28"
