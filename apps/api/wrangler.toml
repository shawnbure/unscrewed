name = "unscrewed-api"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Custom domain — auto-creates AAAA + SSL on the unscrewed.lol zone.

# ---------- D1 ----------
[[d1_databases]]
binding = "DB"
database_name = "unscrewed"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/src/migrations"

# ---------- KV ----------
[[kv_namespaces]]
binding = "SESSIONS"
id = "00000000000000000000000000000000"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000000"

# ---------- R2 ----------
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "unscrewed-photos"     # `wrangler r2 bucket create unscrewed-photos`

# ---------- Workers AI ----------
[ai]
binding = "AI"

# ---------- Transactional email ----------

# ---------- Durable Objects ----------
[[durable_objects.bindings]]
name = "NEGOTIATION"
class_name = "NegotiationRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NegotiationRoom"]

# ---------- Public env ----------
[vars]
API_BASE_URL = "http://localhost:8787"
PUBLIC_BASE_URL = "http://localhost:5173"
OPERATOR_EMAIL = "operator@example.com"
TOS_VERSION = "2026-07-18"

# ---------- Secrets (set via `wrangler secret put`, do NOT commit) ----------
# SESSION_SECRET
# TURNSTILE_SECRET_KEY
